<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project kasir awal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <div class="row text-center">
            <h1>Project pertama-kasir</h1>
        </div>

        <div class="row justify-content-center mt-3">
            <div class="col-4">
                <div class="input-group">
                    <input type="text" class="form-control" id="nama_barang" placeholder="nama barang">
                </div>
            </div>
            
            <div class="col-4">
                <div class="input-group">
                    <input type="text" class="form-control" id="harga_satuan" placeholder="harga satuan">
                </div>
            </div>
            
            <div class="col-4">
                <div class="input-group">
                    <input type="text" class="form-control" id="jumlah" placeholder="jumlah">
                </div>
            </div>

        </div>

        <div class="row justify-content-center mt-4">
            <button type="button" class="btn-primary col-2" id="button_merge">Masukan Keranjang</button> 
        </div>

        <div class="row text-center mt-5">
            <span id="keranjang_anda">Keranjang Anda</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
    
</body>
</html>
